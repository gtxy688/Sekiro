<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>只狼风 Boss 战 · 3D 第三人称 Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body { background:#0e0f13; color:#ddd; font-family:"Microsoft YaHei", sans-serif;
    display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; }
  #wrap { width:100vw; height:100vh; position:relative; overflow:hidden; background:#14151b; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }

  /* 顶部：Boss 架势条（默认隐藏，受击显示，中心双向） */
  .postureWrap { position:absolute; left:50%; transform:translateX(-50%); width:min(46vw,460px); height:14px;
    background:rgba(30,20,20,.75); border:1px solid #5a3a32; border-radius:3px; overflow:hidden;
    opacity:0; transition:opacity .4s; pointer-events:none; }
  .postureWrap.show { opacity:1; }
  #bossPostureWrap { top:26px; }
  #playerPostureWrap { bottom:64px; }
  .postureBar { position:absolute; top:0; bottom:0; height:100%; width:0;
    background:linear-gradient(#ffd9a0,#e08a3c); transition:width .1s; }
  .postureBar.right { left:50%; }
  .postureBar.left  { right:50%; }
  .postureBar.danger { background:linear-gradient(#ff9a5a,#ff4d4d); animation:blink .3s infinite alternate; }
  @keyframes blink { from{opacity:1;} to{opacity:.55;} }

  #bossStatus { position:absolute; top:60px; left:20px; width:min(30vw,260px); }
  #bossName { font-size:14px; color:#e8c; margin-bottom:4px; text-shadow:0 0 4px #c66; }
  #bossLives { margin-bottom:4px; }
  #bossLives .dot { display:inline-block; width:12px; height:12px; border-radius:50%; background:#8a0a0a;
    box-shadow:0 0 4px #f33; margin-right:4px; }
  #bossLives .dot.off { background:#4a3a3a; box-shadow:none; }
  #bossHPbar { height:10px; background:rgba(0,0,0,.5); border-radius:3px; overflow:hidden; border:1px solid #555; }
  #bossHPfill { height:100%; width:100%; background:linear-gradient(#e05a5a,#9a2a2a); transition:width .3s; }

  #playerStatus { position:absolute; bottom:80px; left:20px; width:min(30vw,260px); }
  #playerRevive { width:14px; height:14px; border-radius:50%; background:#ff6b9d; box-shadow:0 0 6px #f69;
    margin-bottom:4px; transition:background .3s; }
  #playerRevive.off { background:#4a3a3a; box-shadow:none; }
  #playerHPbar { height:12px; background:rgba(0,0,0,.5); border-radius:3px; overflow:hidden; border:1px solid #555; }
  #playerHPfill { height:100%; width:100%; background:linear-gradient(#8ae05a,#3a9a2a); transition:width .3s; }

  #gourd { position:absolute; bottom:80px; right:20px; text-align:center; }
  #gourdIcon { font-size:34px; filter:drop-shadow(0 0 6px #a44); }
  #gourdCount { font-size:14px; color:#e8c; }

  #bigText { position:absolute; top:34%; left:50%; transform:translate(-50%,-50%);
    font-size:min(10vw,70px); font-weight:bold; text-shadow:0 0 20px #000; display:none; pointer-events:none; }
  #subText { position:absolute; top:calc(34% + 74px); left:50%; transform:translateX(-50%);
    font-size:20px; color:#eee; display:none; pointer-events:none; text-shadow:0 0 8px #000; }
  #peril { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%);
    font-size:min(16vw,130px); font-weight:900; color:#f22; text-shadow:0 0 30px #f00, 0 0 60px #900;
    display:none; pointer-events:none; animation:perilPulse .5s infinite alternate; }
  @keyframes perilPulse { from{ transform:translate(-50%,-50%) scale(1);} to{ transform:translate(-50%,-50%) scale(1.15);} }

  #flash { position:absolute; inset:0; background:radial-gradient(circle,transparent 40%, rgba(255,40,40,.55));
    opacity:0; pointer-events:none; transition:opacity .12s; }
  #vignette { position:absolute; inset:0; box-shadow:inset 0 0 120px rgba(0,0,0,.65); pointer-events:none; }

  #help { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:13px; color:#777;
    text-shadow:0 0 6px #000; }
  #help kbd { background:#2a2a30; padding:1px 7px; border-radius:4px; color:#ccc; font-size:12px; border:1px solid #444; }

  #err { position:absolute; top:0; left:0; right:0; background:#600; color:#fff; font:12px monospace;
    padding:6px; display:none; z-index:99; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="wrap">
  <div id="err"></div>
  <canvas id="cvs"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="bossPostureWrap" class="postureWrap">
    <div id="bossPostureBarL" class="postureBar left"></div>
    <div id="bossPostureBarR" class="postureBar right"></div>
  </div>
  <div id="playerPostureWrap" class="postureWrap">
    <div id="playerPostureBarL" class="postureBar left"></div>
    <div id="playerPostureBarR" class="postureBar right"></div>
  </div>

  <div id="bossStatus">
    <div id="bossName">苇名弦一郎</div>
    <div id="bossLives"><span class="dot"></span><span class="dot"></span></div>
    <div id="bossHPbar"><div id="bossHPfill"></div></div>
  </div>

  <div id="playerStatus">
    <div id="playerRevive"></div>
    <div id="playerHPbar"><div id="playerHPfill"></div></div>
  </div>

  <div id="gourd"><div id="gourdIcon">🍶</div><div id="gourdCount">×3</div></div>

  <div id="peril">危</div>
  <div id="bigText"></div>
  <div id="subText"></div>

  <div id="help">
    <kbd>W A S D</kbd> 相机相对移动 &nbsp; <kbd>鼠标拖拽</kbd> 转视角 &nbsp; <kbd>J</kbd> 攻击 &nbsp;
    <kbd>K</kbd> 按住格挡 / 点按弹反 &nbsp; <kbd>L</kbd> 垫步闪避 &nbsp; <kbd>U</kbd> 葫芦 &nbsp; <kbd>R</kbd> 重开
  </div>
</div>

<script>
// 全局错误捕获：出错直接显示在页面顶部，方便截图排查
window.addEventListener('error', e=>{
  const el=document.getElementById('err');
  el.style.display='block'; el.textContent = e.message+' @ '+e.lineno+':'+e.colno;
});

const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
function resize(){ cvs.width=innerWidth; cvs.height=innerHeight; }
resize(); window.addEventListener('resize', resize);
const W=cvs.width, H=cvs.height;

// ---------- 配置 ----------
const cfg={ bossPostureMax:100, playerPostureMax:60, playerMaxHP:40, bossMaxHP:70,
  gourdMax:3, reviveCount:1, bossLives:2, finisherRange:2.0,
  regenDelay:1.0, bossRegen:14, playerRegen:8 };

const player={ x:-3, z:0, yaw:0, hp:cfg.playerMaxHP, maxHp:cfg.playerMaxHP,
  posture:0, maxPosture:cfg.playerPostureMax, gourd:cfg.gourdMax, revives:cfg.reviveCount,
  dead:false, pending:false, defWindow:0, guard:false, attacking:false, attackingT:0, atkCd:0,
  dodgeT:0, dodgeVX:0, dodgeVZ:0, iframes:0, brokenT:0, staggerT:0, hurtT:0,
  hurtDelay:0, showT:0, walkPhase:0, moving:false };
const boss={ x:3, z:0, yaw:Math.PI, hp:cfg.bossMaxHP, maxHp:cfg.bossMaxHP,
  posture:0, maxPosture:cfg.bossPostureMax, lives:cfg.bossLives,
  stance:'idle', stanceT:0, brokenT:0, anim:0, animHit:false, atkCd:2.5,
  peril:false, telegrafT:0, deflectWindow:0, hurtT:0, hurtDelay:0, showT:0,
  walkPhase:0, moving:false };

let victory=false, camYaw=0, camPitch=0.42, shakeT=0;

// ============================================================
// 输入
// ============================================================
const input={ f:0, s:0, l:0, r:0, atk:false, guardHeld:false, guardPressed:false, dodge:false, drink:false };
window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  switch(e.code){
    case 'KeyW': input.f=1; break;
    case 'KeyS': input.s=1; break;
    case 'KeyA': input.l=1; break;
    case 'KeyD': input.r=1; break;
    case 'KeyJ': input.atk=true; break;
    case 'KeyK': if(!input.guardHeld){ input.guardPressed=true; input.guardHeld=true; } break;
    case 'KeyL': input.dodge=true; break;
    case 'KeyU': input.drink=true; break;
    case 'KeyR': reset(); break;
  }
});
window.addEventListener('keyup',e=>{
  switch(e.code){
    case 'KeyW': input.f=0; break;
    case 'KeyS': input.s=0; break;
    case 'KeyA': input.l=0; break;
    case 'KeyD': input.r=0; break;
    case 'KeyK': input.guardHeld=false; break;
  }
});
let dragging=false, lastMX=0, lastMY=0;
cvs.addEventListener('mousedown',e=>{ dragging=true; lastMX=e.clientX; lastMY=e.clientY; });
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('mousemove',e=>{
  if(!dragging) return;
  camYaw += (e.clientX-lastMX)*0.006;
  camPitch = Math.max(0.05, Math.min(1.0, camPitch - (e.clientY-lastMY)*0.006));
  lastMX=e.clientX; lastMY=e.clientY;
});

// ---------- UI ----------
const $=id=>document.getElementById(id);
function setPostureBar(prefix,ratio){
  ratio=Math.max(0,Math.min(1,ratio));
  const danger=ratio>0.8;
  [$(prefix+'L'),$(prefix+'R')].forEach(el=>{
    el.style.width=(ratio*50)+'%';
    el.classList.toggle('danger',danger);
  });
}
function setPostureVisible(which,on){
  $(which==='boss'?'bossPostureWrap':'playerPostureWrap').classList.toggle('show',on);
}
function touchPosture(t,which){ t.showT=2.5; setPostureVisible(which,true); }
function setHPbar(){
  $('bossHPfill').style.width=(Math.max(0,boss.hp/boss.maxHp)*100)+'%';
  $('playerHPfill').style.width=(Math.max(0,player.hp/player.maxHp)*100)+'%';
}
function setLives(){ [...$('bossLives').children].forEach((d,i)=>d.classList.toggle('off',i>=boss.lives)); }
function setRevive(){ $('playerRevive').classList.toggle('off',player.revives<=0); }
function setGourd(){ $('gourdCount').textContent='×'+player.gourd; }
function bigText(main,sub,dur=1200,color){
  $('bigText').style.display='block'; $('bigText').textContent=main; $('bigText').style.color=color||'#fff';
  $('subText').style.display=sub?'block':'none'; $('subText').textContent=sub||'';
  clearTimeout(bigText.t); bigText.t=setTimeout(()=>{ $('bigText').style.display='none'; $('subText').style.display='none'; },dur);
}
function showPeril(on){ $('peril').style.display=on?'block':'none'; }
function flashRed(){ const f=$('flash'); f.style.opacity=1; requestAnimationFrame(()=>f.style.opacity=0); }

// ---------- 架势回复（非线性） ----------
function postureRegen(t,rate,dt){
  if(t.dead||t.brokenT>0) return;
  if(t.hurtT>0){ t.hurtDelay=cfg.regenDelay; return; }
  if(t.hurtDelay>0){ t.hurtDelay-=dt; return; }
  const r=t.posture/t.maxPosture;
  t.posture=Math.max(0,t.posture-rate*(1-r*0.7)*dt);
}

// ---------- 战斗结算 ----------
function hurtTarget(t,dmg,postureDmg){
  if(t.dead) return;
  t.hp-=dmg; t.posture+=postureDmg; t.hurtT=0.3; t.hurtDelay=cfg.regenDelay;
  touchPosture(t,t===boss?'boss':'player');
  shakeT=0.18; flashRed();
  if(t.hp<=0){ if(t===player) playerDeath(); else bossDeath(); return; }
  if(t.posture>=t.maxPosture) postureBreak(t);
}
function postureBreak(t){
  t.posture=0; t.brokenT=5; t.hurtT=0; t.showT=5;
  setPostureBar('bossPostureBar',0);
  setPostureBar('playerPostureBar',0);
  setPostureVisible(t===boss?'boss':'player',true); setHPbar();
  shakeT=0.4; flashRed();
  if(t===boss){ bigText('架势崩解！','走近按 J 处决',3000,'#ff8'); }
  else { bigText('你被打倒在地！','架势清空',2000,'#f88'); }
}
function finisher(){
  boss.hp=0; boss.brokenT=0; boss.animHit=false;
  boss.lives--; setLives();
  if(boss.lives<=0){ victory=true; bigText('胜利','弦一郎已被斩于刀下',99999,'#ffd700'); return; }
  boss.hp=boss.maxHp; boss.stance='recover'; boss.stanceT=1.5; boss.atkCd=3;
  bigText('忍杀！','还有一条命',1600,'#ffd700'); setHPbar();
}
function playerDeath(){
  player.dead=true;
  if(player.revives>0){ player.revives--; setRevive(); player.pending=true;
    bigText('回生','按 J 复活',99999,'#ff6b9d'); }
  else { player.pending=false; bigText('你死了','按 R 重新开始',99999,'#f33'); }
}
function playerRevive(){
  player.pending=false; player.dead=false;
  player.hp=player.maxHp; player.posture=0;
  setRevive(); setHPbar(); player.iframes=1.5;
  bigText('复活','获得短暂无敌',1200,'#8ae05a');
}
function reset(){
  Object.assign(player,{x:-3,z:0,yaw:0,hp:cfg.playerMaxHP,posture:0,gourd:cfg.gourdMax,
    revives:cfg.reviveCount,dead:false,pending:false,defWindow:0,guard:false,attacking:false,
    attackingT:0,atkCd:0,dodgeT:0,dodgeVX:0,dodgeVZ:0,iframes:0,brokenT:0,staggerT:0,hurtT:0,
    hurtDelay:0,showT:0,walkPhase:0,moving:false});
  Object.assign(boss,{x:3,z:0,yaw:Math.PI,hp:cfg.bossMaxHP,posture:0,lives:cfg.bossLives,
    stance:'idle',stanceT:0,brokenT:0,atkCd:2.5,peril:false,telegrafT:0,deflectWindow:0,
    hurtT:0,hurtDelay:0,showT:0,walkPhase:0,moving:false,anim:0,animHit:false});
  victory=false; camYaw=0; setLives(); setRevive(); setGourd(); setHPbar();
  setPostureBar('bossPostureBar',0); setPostureBar('playerPostureBar',0);
  setPostureVisible('boss',false); setPostureVisible('player',false);
  $('bigText').style.display='none'; $('subText').style.display='none'; showPeril(false);
  bigText('战斗开始','WASD 移动 · 鼠标拖拽转视角 · J 攻击 · K 格挡/弹反 · L 垫步',2000);
}
// ============================================================
// 3D 引擎（软件渲染：透视投影 + 画家算法）
// ============================================================
const UPV=[0,1,0];
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function norm(a){ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; }

// 相机：跟随玩家，鼠标可绕 Y 轴转 + 上下俯仰
function camTransform(){
  const dist=6.5;
  const eye=[ player.x - Math.sin(camYaw)*Math.cos(camPitch)*dist,
              2.6 + Math.sin(camPitch)*dist,
              player.z - Math.cos(camYaw)*Math.cos(camPitch)*dist ];
  const target=[ player.x, 1.3, player.z ];
  const f=norm(sub(target,eye));
  const r=norm(cross(f,UPV));
  const u=cross(r,f);
  return {eye, f, r, u, target};
}
let cam=null;

// 世界坐标 → 屏幕坐标
function project(p){
  if(!cam) return null;
  const d=sub(p,cam.eye);
  const x=dot(d,cam.r), y=dot(d,cam.u), z=dot(d,cam.f);
  if(z<=0.1) return null;               // 相机背后的面剔除
  const f=620;
  return { x: W/2 + x*f/z, y: H/2 - y*f/z, z, px:p };
}

// 一个面：4 个世界点 + 颜色 + 亮度系数
const faces=[];
function face(pts, hex, bright){ faces.push({pts, hex, bright}); }
// 盒体：中心/尺寸/绕Y旋转
function box(cx,cy,cz, sx,sy,sz, ry, hex){
  const c=Math.cos(ry), s=Math.sin(ry);
  const hx=sx/2, hy=sy/2, hz=sz/2;
  const V=(lx,ly,lz)=>[ cx + lx*c + lz*s, cy+ly, cz - lx*s + lz*c ];
  const p=[V(-hx,-hy,-hz),V(hx,-hy,-hz),V(hx,hy,-hz),V(-hx,hy,-hz),
           V(-hx,-hy,hz),V(hx,-hy,hz),V(hx,hy,hz),V(-hx,hy,hz)];
  face([p[4],p[5],p[6],p[7]], hex, 1.0);   // 前（朝向 +Z）
  face([p[0],p[1],p[2],p[3]], hex, 0.55);  // 后
  face([p[1],p[2],p[6],p[5]], hex, 0.8);   // 右
  face([p[0],p[3],p[7],p[4]], hex, 0.6);   // 左
  face([p[3],p[2],p[6],p[7]], hex, 0.95);  // 顶
  face([p[0],p[1],p[5],p[4]], hex, 0.35);  // 底
}
// 圆柱（近似：八棱柱），用于树干/剑柄
function cylinder(cx,cy,cz, r, h, ry, hex){
  const N=8;
  for(let i=0;i<N;i++){
    const a0=i/N*Math.PI*2, a1=(i+1)/N*Math.PI*2;
    const x0=cx+Math.cos(a0+ry)*r, x1=cx+Math.cos(a1+ry)*r;
    const z0=cz+Math.sin(a0+ry)*r, z1=cz+Math.sin(a1+ry)*r;
    const bright=i%2?0.7:0.9;
    face([[x0,cy,z0],[x1,cy,z1],[x1,cy+h,z1],[x0,cy+h,z0]], hex, bright);
  }
  face([[cx+r,cy,cz],[cx,cy,cz+r],[cx-r,cy,cz],[cx,cy,cz-r]].map(p=>[p[0],cy,p[1]]), hex, 1.0); // 顶近似
}

// 角色骨架：身体/头/双臂/双腿（含剑），全用盒体拼
function drawCharacter(c,isPlayer){
  const cx=c.x, cz=c.z;
  const ry=c.yaw;
  const bodyHex=isPlayer?'#5a7a4a':'#8a3a3a';
  const clothHex=isPlayer?'#3a4a2a':'#6a2a2a';
  const skinHex=isPlayer?'#d8b090':'#e0c0a0';
  const swordHex=isPlayer?'#c8c8c8':'#e8c878';
  const idleBob=Math.sin(c.walkPhase)*0.06;
  const hipY=1.05+idleBob, shoulderY=1.5+idleBob;

  // 身体（朝 ry 方向）
  box(cx, hipY, cz, 0.7, 1.0, 0.4, ry, bodyHex);
  box(cx, shoulderY, cz, 0.5, 0.7, 0.3, ry, clothHex);      // 躯干
  box(cx, shoulderY+0.32, cz, 0.28, 0.3, 0.28, ry, skinHex); // 头

  // 腿（行走摆动）
  const legSwing=Math.sin(c.walkPhase)*0.35;
  const legL=[[cx-0.16,hipY-0.4,cz],[cx+legSwing*Math.cos(ry),0.3,cz+legSwing*Math.sin(ry)]];
  const legR=[[cx+0.16,hipY-0.4,cz],[cx-legSwing*Math.cos(ry),0.3,cz-legSwing*Math.sin(ry)]];
  drawLimb(legL[0],legL[1],0.16,clothHex);
  drawLimb(legR[0],legR[1],0.16,clothHex);
  // 脚
  box(legL[1][0],0.12,legL[1][2], 0.24,0.12,0.36, ry, '#3a2a1a');
  box(legR[1][0],0.12,legR[1][2], 0.24,0.12,0.36, ry, '#3a2a1a');

  // 手臂状态（玩家与 Boss 共用：Boss 用 stance，玩家用 attacking/guard）
  const shoulderL=[cx-0.28,shoulderY,cz], shoulderR=[cx+0.28,shoulderY,cz];
  const attackingNow = isPlayer ? c.attacking : (c.stance==='attackAnim');
  const guardingNow = isPlayer ? (c.guard && c.defWindow<=0) : (c.stance==='defend');
  const hurt = c.hurtT>0;
  const swingT = attackingNow
    ? (isPlayer ? 1-c.attackingT/0.35 : (0.5-c.anim)/0.5)
    : 0;

  // 左臂：待机下垂 / 攻击时微微后摆
  let armL;
  if(attackingNow){ armL=[shoulderL, [shoulderL[0]-0.25, shoulderY-0.05, shoulderL[2]]]; }
  else { armL=[shoulderL, [shoulderL[0]-0.15, shoulderY-0.5, shoulderL[2]]]; }
  drawLimb(armL[0],armL[1],0.13,clothHex);

  // 右臂（持剑）
  const swordDir=[Math.sin(ry),0,Math.cos(ry)];
  let handR;
  if(guardingNow){
    // 格挡：剑横在身前
    handR=[shoulderR[0]+swordDir[0]*0.35, shoulderY-0.05, shoulderR[2]+swordDir[2]*0.35];
    drawLimb(shoulderR, handR, 0.13, clothHex);
    const tip=[handR[0]+swordDir[0]*0.6, handR[1]+0.25, handR[2]+swordDir[2]*0.6];
    drawSword(handR, tip, swordHex);
  } else if(attackingNow){
    // 挥砍：剑从上方劈下（swingT 0→1）
    const swingRot=-Math.PI/2 + swingT*Math.PI*0.85;
    const sDir=[Math.sin(ry+swingRot),0,Math.cos(ry+swingRot)];
    handR=[shoulderR[0]+sDir[0]*0.6, shoulderY+0.35 - swingT*0.6, shoulderR[2]+sDir[2]*0.6];
    drawLimb(shoulderR, handR, 0.13, clothHex);
    const tip=[handR[0]+sDir[0]*0.95, handR[1]+0.05, handR[2]+sDir[2]*0.95];
    drawSword(handR, tip, swordHex);
  } else {
    // 待机/受击：持剑垂于身侧
    if(hurt){ handR=[shoulderR[0], shoulderY-0.7, shoulderR[2]]; }
    else { handR=[shoulderR[0]+swordDir[0]*0.25, shoulderY-0.55, shoulderR[2]+swordDir[2]*0.25]; }
    drawLimb(shoulderR, handR, 0.13, clothHex);
    const tip=[handR[0]+swordDir[0]*0.7, handR[1]-0.15, handR[2]+swordDir[2]*0.7];
    drawSword(handR, tip, swordHex);
  }
}
// 沿任意方向的盒体：X/Y/Z 为局部坐标系基向量（Y 沿长轴）
function boxAligned(c, sx,sy,sz, X,Y,Z, hex){
  const hx=sx/2, hy=sy/2, hz=sz/2;
  const V=(lx,ly,lz)=>[ c[0]+X[0]*lx+Y[0]*ly+Z[0]*lz,
                        c[1]+X[1]*lx+Y[1]*ly+Z[1]*lz,
                        c[2]+X[2]*lx+Y[2]*ly+Z[2]*lz ];
  const p=[V(-hx,-hy,-hz),V(hx,-hy,-hz),V(hx,hy,-hz),V(-hx,hy,-hz),
           V(-hx,-hy,hz),V(hx,-hy,hz),V(hx,hy,hz),V(-hx,hy,hz)];
  face([p[4],p[5],p[6],p[7]], hex, 1.0);
  face([p[0],p[1],p[2],p[3]], hex, 0.55);
  face([p[1],p[2],p[6],p[5]], hex, 0.8);
  face([p[0],p[3],p[7],p[4]], hex, 0.6);
  face([p[3],p[2],p[6],p[7]], hex, 0.95);
  face([p[0],p[1],p[5],p[4]], hex, 0.35);
}
// 由两点求定向盒体的基向量（Y 沿 a→b）
function limbBasis(a,b){
  const d=sub(b,a), len=Math.hypot(d[0],d[1],d[2]);
  if(len<0.01) return null;
  const Y=norm(d);
  const up = Math.abs(Y[1])>0.9 ? [1,0,0] : UPV;
  const X=norm(cross(up,Y));
  const Z=cross(Y,X);
  return {X,Y,Z,mid:[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2]};
}
// 肢体：沿方向的细盒
function drawLimb(a,b,w,hex){
  const B=limbBasis(a,b); if(!B) return;
  boxAligned(B.mid, w, Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]), w, B.X,B.Y,B.Z, hex);
}
// 剑：沿方向的细长盒 + 剑尖三角
function drawSword(h,tip,hex){
  const B=limbBasis(h,tip); if(!B) return;
  const len=Math.hypot(tip[0]-h[0],tip[1]-h[1],tip[2]-h[2]);
  boxAligned(B.mid, 0.07, len, 0.07, B.X,B.Y,B.Z, hex);
  const t=tip, d=B.Y;
  face([t,[t[0]-d[2]*0.1,t[1]+0.1,t[2]+d[0]*0.1],
        [t[0]+d[2]*0.1,t[1]-0.1,t[2]-d[0]*0.1]], '#f2d8a0', 1.0);
}

// 场景装饰：石台 + 石柱 + 火盆
function drawGround(){
  // 地面
  box(0,-0.05,0, 40,0.1,40, 0, '#2c2a26');
  // 石台（战斗区域）
  box(0,0.05,0, 12,0.1,12, 0, '#4a443c');
  // 四角石柱
  const cols=[[-8,-8],[8,-8],[-8,8],[8,8]];
  cols.forEach(c=>{ cylinder(c[0],0,c[1],0.5,4,0,'#5a5448'); box(c[0],4.2,c[1],0.5,0.3,0.5,0,'#6a6458'); });
  // 火盆（光源感）
  cylinder(-4,0,5,0.6,1,0,'#3a3428');
  face([[-4,1,5],[-3.4,1,5],[-3.4,1.6,5],[-4,1.6,5]], '#ffaa33', 1.0);
  face([[-3.4,1,5],[-3.4,1,5.6],[-3.4,1.6,5.6],[-3.4,1.6,5]], '#ffaa33', 1.0);
}

// 命中火花粒子
const particles=[];
function spawnSparks(x,y,z,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, u=Math.random()*2-1;
    particles.push({ x,y,z, vx:Math.cos(a)*3, vy:Math.abs(u)*4, vz:Math.sin(a)*3, life:0.5, t:0 });
  }
}
function updateParticles(dt){
  for(const p of particles){
    p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vy-=9*dt;
  }
  for(let i=particles.length-1;i>=0;i--) if(particles[i].t>=particles[i].life) particles.splice(i,1);
}
function drawParticles(){
  for(const p of particles){
    const sp=project([p.x,p.y,p.z]);
    if(!sp) continue;
    const a=1-p.t/p.life;
    ctx.fillStyle=`rgba(255,220,120,${a})`;
    ctx.beginPath(); ctx.arc(sp.x,sp.y, 3+3*a, 0, Math.PI*2); ctx.fill();
  }
}

// 渲染主流程
function render(){
  // 天空渐变
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a1c26'); g.addColorStop(1,'#3a3f52');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 相机（含震动偏移）
  cam=camTransform();
  if(shakeT>0){ cam.eye[0]+=(Math.random()-0.5)*0.4; cam.eye[1]+=(Math.random()-0.5)*0.4; cam.eye[2]+=(Math.random()-0.5)*0.4; }

  faces.length=0;
  drawGround();
  // 玩家头顶"危"提示（Boss 出危字时）
  if(boss.peril){
    const sp=project([boss.x, 2.6, boss.z]);
    if(sp){ ctx.font='bold 30px "Microsoft YaHei"'; ctx.fillStyle='#ff2222'; ctx.textAlign='center';
      ctx.fillText('危', sp.x, sp.y); }
  }
  drawCharacter(player,true);
  drawCharacter(boss,false);
  drawParticles();

  // 画家算法：按相机深度排序画所有面
  const drawn=[];
  for(const f of faces){
    const pr=f.pts.map(project);
    if(pr.some(p=>!p)) continue;
    const depth=pr.reduce((s,p)=>s+p.z,0)/pr.length;
    drawn.push({pr, depth, hex:f.hex, bright:f.bright});
  }
  drawn.sort((a,b)=>b.depth-a.depth);   // 远的先画
  for(const f of drawn){
    ctx.beginPath();
    ctx.moveTo(f.pr[0].x,f.pr[0].y);
    for(let i=1;i<f.pr.length;i++) ctx.lineTo(f.pr[i].x,f.pr[i].y);
    ctx.closePath();
    const n=parseInt(f.hex.slice(1),16);
    const b=f.bright;
    ctx.fillStyle=`rgb(${(n>>16&255)*b|0},${(n>>8&255)*b|0},${(n&255)*b|0})`;
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=0.5; ctx.stroke();
  }

  // 网格线画在最上层（避免被地面盒盖住）
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1;
  for(let i=-18;i<=18;i+=3){
    const a=project([i,0.01,-18]), b=project([i,0.01,18]);
    if(a&&b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    const c=project([-18,0.01,i]), d=project([18,0.01,i]);
    if(c&&d){ ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.stroke(); }
  }
}

// ============================================================
// 游戏逻辑
// ============================================================
function dist3(a,b){ return Math.hypot(a.x-b.x, a.z-b.z); }

function playerUpdate(dt){
  if(player.dead){
    if(player.pending && input.atk){ input.atk=false; playerRevive(); }
    return;
  }
  player.hurtT=Math.max(0,player.hurtT-dt);
  player.iframes=Math.max(0,player.iframes-dt);
  player.dodgeT=Math.max(0,player.dodgeT-dt);
  player.atkCd=Math.max(0,player.atkCd-dt);
  if(player.attacking){ player.attackingT-=dt; if(player.attackingT<=0) player.attacking=false; }

  postureRegen(player,cfg.playerRegen,dt);
  if(player.showT>0){ player.showT-=dt; if(player.showT<=0 && player.posture<=0) setPostureVisible('player',false); }
  setPostureBar('playerPostureBar',player.posture/player.maxPosture);

  player.brokenT=Math.max(0,player.brokenT-dt);
  player.staggerT=Math.max(0,player.staggerT-dt);
  if(player.brokenT>0||player.staggerT>0) return;

  // 垫步冲刺
  if(player.dodgeT>0){
    player.x+=player.dodgeVX*dt; player.z+=player.dodgeVZ*dt;
    player.dodgeVX*=Math.max(0,1-4*dt); player.dodgeVZ*=Math.max(0,1-4*dt);
  }

  // 相机相对移动
  const fw=[Math.sin(camYaw),0,Math.cos(camYaw)];
  const rt=[Math.cos(camYaw),0,-Math.sin(camYaw)];
  let mx=(input.r-input.l), mz=(input.f-input.s);
  player.moving = (mx!==0||mz!==0) && player.dodgeT<=0 && !player.attacking;
  if(player.moving){
    const sp=4.2;
    const dx=(fw[0]*mz+rt[0]*mx)*sp*dt, dz=(fw[2]*mz+rt[2]*mx)*sp*dt;
    player.x+=dx; player.z+=dz;
    player.walkPhase+=dt*9;
    player.yaw=Math.atan2(dx,dz);   // 面向移动方向
  }

  // 垫步（方向 = 当前移动方向，无敌帧）
  if(input.dodge && player.dodgeT<=0 && !player.attacking){
    input.dodge=false;
    player.dodgeT=0.3; player.iframes=0.3;
    const dir=(player.moving)?norm([fw[0]*mz+rt[0]*mx,0,fw[2]*mz+rt[2]*mx]):norm([-fw[0],0,-fw[2]]);
    player.dodgeVX=dir[0]*7; player.dodgeVZ=dir[2]*7;
    player.yaw=Math.atan2(dir[0],dir[2]);
  }

  // 防御
  if(input.guardPressed){ input.guardPressed=false; player.defWindow=0.3; player.guard=true; }
  player.defWindow=Math.max(0,player.defWindow-dt);
  if(!input.guardHeld) player.guard=false;

  // 攻击
  if(input.atk){
    input.atk=false;
    if(!player.attacking && player.atkCd<=0){
      if(boss.brokenT>0 && dist3(player,boss)<=cfg.finisherRange){ finisher(); }
      else {
        player.attacking=true; player.attackingT=0.35; player.atkCd=0.45;
        player.guard=false; player.defWindow=0;
        // 面向 Boss
        player.yaw=Math.atan2(boss.x-player.x, boss.z-player.z);
      }
    }
  }

  // 葫芦
  if(input.drink && player.gourd>0 && !player.attacking){
    player.gourd--; setGourd();
    player.hp=Math.min(player.maxHp,player.hp+12); setHPbar();
  }
}

function bossUpdate(dt){
  boss.hurtT=Math.max(0,boss.hurtT-dt);
  boss.deflectWindow=Math.max(0,boss.deflectWindow-dt);
  boss.atkCd=Math.max(0,boss.atkCd-dt);
  boss.telegrafT=Math.max(0,boss.telegrafT-dt);
  boss.stanceT-=dt;

  postureRegen(boss,cfg.bossRegen,dt);
  if(boss.showT>0){ boss.showT-=dt; if(boss.showT<=0 && boss.posture<=0) setPostureVisible('boss',false); }
  setPostureBar('bossPostureBar',boss.posture/boss.maxPosture);

  // 面向玩家
  boss.yaw=Math.atan2(player.x-boss.x, player.z-boss.z);

  if(boss.brokenT>0){
    boss.brokenT-=dt; if(boss.brokenT<=0){ boss.stance='recover'; boss.stanceT=0.8; }
    return;
  }
  const d=dist3(boss,player);

  switch(boss.stance){
    case 'idle':
      if(d>2.6){ // 追击
        const dir=norm([player.x-boss.x,0,player.z-boss.z]);
        boss.x+=dir[0]*2.2*dt; boss.z+=dir[2]*2.2*dt;
        boss.walkPhase+=dt*8; boss.moving=true;
      } else { boss.moving=false; if(boss.atkCd<=0) pickAttack(); }
      break;
    case 'recover': case 'stagger': case 'defend':
      boss.moving=false;
      if(boss.stanceT<=0) boss.stance='idle';
      break;
    case 'telegraf':
      boss.moving=false;
      if(boss.telegrafT<=0) boss.stance='attack';
      break;
    case 'attack':
      // 连续冲刺逼近直到贴近
      boss.moving=true;
      const atkDir=norm([player.x-boss.x,0,player.z-boss.z]);
      boss.x+=atkDir[0]*4.0*dt; boss.z+=atkDir[2]*4.0*dt;
      boss.walkPhase+=dt*10;
      if(dist3(boss,player)<1.9){ boss.stance='attackAnim'; boss.anim=0.5; boss.animHit=false; }
      break;
    case 'attackAnim':
      boss.moving=false;
      if(boss.anim<0.42 && boss.anim>0.24 && !boss.animHit){
        boss.animHit=true;
        const hitDist=dist3(boss,player);
        if(boss.peril){
          if(player.dodgeT>0||player.iframes>0){ /* 闪开 */ }
          else if(hitDist<2.6){ bigText('危！','突刺无视防御',700,'#f22'); hurtTarget(player,14,25); }
        } else if(player.defWindow>0){
          player.defWindow=0;
          boss.posture+=22; setPostureBar('bossPostureBar',boss.posture/boss.maxPosture);
          touchPosture(boss,'boss'); shakeT=0.15; flashRed();
          spawnSparks(boss.x,1.4,boss.z);
          boss.stance='stagger'; boss.stanceT=1.0;
          bigText('叮！','弹反成功，Boss 硬直',900,'#ffd');
        } else if(player.guard){
          player.posture+=8; setPostureBar('playerPostureBar',player.posture/player.maxPosture);
          touchPosture(player,'player');
        } else if(hitDist<2.6){ hurtTarget(player,9,15); }
      }
      boss.anim-=dt;
      if(boss.anim<=0){ boss.stance='idle'; boss.atkCd=2.2+Math.random()*1.5; boss.peril=false; showPeril(false); }
      break;
  }
}
function pickAttack(){
  const usePeril=Math.random()<0.35;
  boss.peril=usePeril; boss.stance='telegraf';
  boss.telegrafT=usePeril?0.9:0.4;
  showPeril(usePeril);
}

// 玩家攻击判定
let playerAtkDone=false;
function playerAtkCheck(){
  if(player.attacking && player.attackingT<0.24 && player.attackingT>0.1 && !playerAtkDone){
    playerAtkDone=true;
    const d=dist3(player,boss);
    const inRange = d<2.2 && boss.brokenT<=0 && boss.stance!=='stagger';
    if(inRange){
      if(boss.deflectWindow>0){
        boss.deflectWindow=0; shakeT=0.15; flashRed();
        player.posture+=22; setPostureBar('playerPostureBar',player.posture/player.maxPosture);
        touchPosture(player,'player'); player.staggerT=0.8;
        spawnSparks(boss.x,1.4,boss.z);
        bigText('被弹反！','架势大涨',1000,'#f88');
      } else if(boss.stance==='defend'){
        boss.posture+=8; setPostureBar('bossPostureBar',boss.posture/boss.maxPosture);
        touchPosture(boss,'boss');
        spawnSparks(boss.x,1.4,boss.z);
      } else if(boss.stance==='idle' && Math.random()<0.4){
        boss.stance='defend'; boss.stanceT=0.6;
        boss.posture+=8; setPostureBar('bossPostureBar',boss.posture/boss.maxPosture);
        touchPosture(boss,'boss');
        spawnSparks(boss.x,1.4,boss.z);
      } else {
        hurtTarget(boss,7,12); setPostureBar('bossPostureBar',boss.posture/boss.maxPosture); setHPbar();
        spawnSparks(boss.x,1.4,boss.z);
      }
    }
  }
  if(player.attackingT<=0.1) playerAtkDone=false;
}

// ---------- 主循环 ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  if(shakeT>0) shakeT-=dt;
  updateParticles(dt);
  bossUpdate(dt); playerUpdate(dt); playerAtkCheck();
  render();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
